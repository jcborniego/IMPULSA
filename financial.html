<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas | Impulsa</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .financial-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            align-items: stretch;
        }
        .financial-img-panel {
            position: relative;
            overflow: hidden;
        }
        .financial-img-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .financial-img-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent 60%, var(--bg-color));
            z-index: 1;
        }
        .financial-content-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 7rem 4rem 4rem 3rem;
            position: relative;
            z-index: 10;
        }
        @media (max-width: 768px) {
            .financial-layout { grid-template-columns: 1fr; }
            .financial-img-panel { height: 280px; }
            .financial-content-panel { padding: 3rem 1.5rem; }
        }
    </style>
</head>

<body class="diagnostic-body" style="display:block;">
    <nav class="glass-nav minimal">
        <a href="index.html" class="logo text-decoration-none">← Volver al Ecosistema</a>
    </nav>

    <div class="financial-layout">
        <div class="financial-img-panel">
            <img src="img-consultation.png" alt="Asesoramiento financiero">
        </div>

        <div class="financial-content-panel">
            <div class="feature-box" style="box-shadow:none; border:none; padding:0; background:transparent; max-width:100%;">
                <div class="feature-header">
                    <h2>📈 Calculadora de Crianza</h2>
                    <p>Reduce la presión del dinero</p>
                </div>

                <div class="input-group">
                    <label>Ingreso Familiar Combinado Mensual</label>
                    <div class="input-field">$ 3.500.000 ARS</div>
                </div>

                <div class="input-group">
                    <label>Gasto estimado: Prepaga Plan Materno/Infantil</label>
                    <div class="input-field" style="color: var(--text-muted); font-weight: 600;">$ 350.000 ARS</div>
                </div>

                <div class="calendar-widget"
                    style="background: var(--primary); color: #fff; margin-top: 2rem; border: none; box-shadow: 0 10px 20px rgba(91,45,142,0.35);">
                    <h3 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem;">Situación Financiera Mapeada</h3>
                    <p style="font-weight: 700; font-size: 1.1rem; line-height: 1.3; opacity: 0.95;">Tienen un colchón financiero óptimo para proyectar un embarazo hoy, sin sacrificar su nivel de vida.</p>
                </div>

                <button class="btn-primary" style="width:100%; margin-top: 1.5rem;">Solicitar asesoría virtual con experto</button>
            </div>
        </div>
    </div>

    <div class="hero-bg-shapes">
        <div class="shape shape-1"></div>
    </div>
</body>
</html>
