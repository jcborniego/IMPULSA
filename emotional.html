<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emocional | Impulsa</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .emotional-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            align-items: stretch;
        }
        .emotional-img-panel {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .emotional-img-panel img {
            width: 100%;
            flex: 1;
            object-fit: cover;
        }
        .emotional-img-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent 60%, var(--bg-color));
            z-index: 1;
        }
        .emotional-content-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 7rem 4rem 4rem 3rem;
            position: relative;
            z-index: 10;
        }
        @media (max-width: 768px) {
            .emotional-layout { grid-template-columns: 1fr; }
            .emotional-img-panel { height: 280px; }
            .emotional-content-panel { padding: 3rem 1.5rem; }
        }
    </style>
</head>

<body class="diagnostic-body" style="display:block;">
    <nav class="glass-nav minimal">
        <a href="index.html" class="logo text-decoration-none">← Volver al Ecosistema</a>
    </nav>

    <div class="emotional-layout">
        <div class="emotional-img-panel">
            <img src="img-psychologist.png" alt="Psicóloga especialista" style="height: 55%;">
            <img src="img-counseling.png" alt="Sesión grupal de apoyo" style="height: 45%;">
        </div>

        <div class="emotional-content-panel">
            <div class="feature-box" style="box-shadow:none; border:none; padding:0; background:transparent; max-width:100%;">
                <div class="feature-header">
                    <h2>💜 Apoyo Emocional</h2>
                    <p>Acompañamiento sin juzgar</p>
                </div>

                <p style="font-weight: 800; font-size: 1.1rem; text-align: left; margin-bottom: 1rem;">Próxima Sesión de Claridad:</p>
                <div class="dashboard-card"
                    style="background: var(--white); box-shadow: 0 10px 30px rgba(91,45,142,0.08); padding: 2rem 1.5rem; border: 2px solid var(--primary-light);">
                    <div class="icon">👩‍⚕️</div>
                    <div>
                        <h3 style="font-size: 1.25rem; font-weight: 800; color: var(--primary);">Miedo a perder mi autonomía</h3>
                        <p style="font-size: 1rem; color: #888; font-weight: 700; margin-top: 5px;">Hoy, 18:30 hrs - Videollamada</p>
                    </div>
                </div>

                <button class="btn-primary" style="width:100%; margin-top: 1rem;">Ingresar a la sala</button>
                <button class="option-btn" style="width:100%; text-align: center; margin-top: 1rem;">Cuaderno de apuntes propio</button>
            </div>
        </div>
    </div>

    <div class="hero-bg-shapes">
        <div class="shape shape-2"></div>
    </div>
</body>
</html>
